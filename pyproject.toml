[project]
name = "thresy"
version = "0.1.0"
description = "Self-hosted running coach: Garmin data in Postgres plus a coding agent that answers chat messages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fitparse>=1.2.0",
    "garminconnect==0.3.20",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "matplotlib>=3.11",
    "numpy>=2.3",
    "pandas>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "python-telegram-bot>=22.0",
    "typer>=0.16",
]

[project.scripts]
coach = "thresy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]
# Only needed to compare against the old bot's Parquet files (legacy parity tests).
legacy = [
    "pyarrow>=21",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Agent worktrees and private data are not part of this checkout's sources.
extend-exclude = [".claude", "legacy", "private"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "RUF001", # ambiguous unicode characters are fine in strings
]

[tool.ruff.lint.isort]
known-first-party = ["thresy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "db: needs the development Postgres (skipped when it is not reachable)",
    "legacy: compares against the old bot's export in COACH_LEGACY_DIR (skipped when unset)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
